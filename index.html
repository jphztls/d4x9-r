<!DOCTYPE html>

<style>
/* --- Token Grado Zero --- */
:root {
  --surface: #ffffff; --ink: #000000; --on-ink: #ffffff;
  --line: var(--ink); --surface-inverse: var(--ink); --ink-inverse: var(--on-ink);

  --border-hairline: 1px; --control-height: 28px; --opacity-muted: .5; --view: #e6e6e6;
  --text: 400 16px/22px var(--font-sans);          /* un'unica dimensione per tutta l'interfaccia */
  --row: 28px;
  color-scheme: light;
}
:root[data-theme="dark"] { --surface: #000000; --ink: #ffffff; --on-ink: #000000; --view: #0b0b0b; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
html, body { margin: 0; position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--surface); color: var(--ink); font: var(--text); }
button, input { font: var(--text); color: inherit; }

#app { position: fixed; left: 0; top: 0; width: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
.top { display: flex; align-items: center; gap: var(--space-3); height: 30px; padding: 0 var(--space-3); flex: none; }
.top .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: var(--opacity-muted); }
.top .theme { width: var(--control-height); height: var(--control-height); padding: 0; background: none; border: 0; cursor: pointer; }

#view { position: relative; flex: none; width: 100%; background: var(--view); overflow: hidden; touch-action: none; }
#view canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#cross { position: absolute; border: 1px solid #fff; mix-blend-mode: difference; pointer-events: none; }

#lens { position: absolute; left: var(--space-3); bottom: var(--space-3); width: 76px; height: 76px; border: var(--border-hairline) solid var(--line); background: #000; }
.top .pos { font-variant-numeric: tabular-nums; }

.list { flex: none; padding: var(--space-2) var(--space-3) 0; }
#rows { height: calc(var(--row) * 6); overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); height: var(--row); padding: 0 var(--space-2); cursor: pointer; }
.row .lb { flex: none; white-space: nowrap; }
.row .vl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.row input { flex: 1; min-width: 0; height: 22px; padding: 0 6px; border: var(--border-hairline) solid currentColor; border-radius: 0; background: transparent; font-size: 16px; -webkit-user-select: text; user-select: text; text-align: right; }
.row.act .lb::after { content: " →"; }
.row.sel { outline: var(--border-hairline) solid var(--line); outline-offset: -1px; }          /* scelto: contorno */
.row.sel.edit { background: var(--surface-inverse); color: var(--ink-inverse); }              /* in modifica: pieno */

.dialwrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#dial { display: block; touch-action: none; cursor: grab; }
#file, #imp { display: none; }
</style>
</head>
<body>

  <div class="top"><span>DSP-1</span><span class="pname" id="pname"></span><span class="pos" id="lpos"></span><button class="theme" id="theme" aria-label="Tema">◐</button></div>
  <div id="view"><canvas id="gl" aria-label="Display simulato"></canvas><div id="cross"></div></div>
  <div class="list"><div id="rows"></div></div>
  <div class="dialwrap"><canvas id="lens" aria-label="Lente"></canvas><canvas id="dial" aria-label="Ghiera: gira per scorrere, OK per modificare"></canvas></div>
</div>
<input type="file" id="file" accept="image/*">
<input type="file" id="imp" accept=".json,application/json">
<script src="display.js"></script>

SECTIONS.forEach((s) => s.rows.forEach((r) => { r.sec = s.t; r.id = r.k || r.a; }));
const ALL = SECTIONS.flatMap((s) => s.rows);
/* Effetti che hanno senso per ogni tecnologia: gli altri non si vedono */
const FX = {
  lcd: ["bloom", "back", "persist", "noise", "view", "edge", "black"],
  lcdmono: ["back", "persist", "noise", "view", "shadow", "edge", "unlit"],
  vfd: ["bloom", "back", "persist", "flick", "noise", "mesh", "edge", "unlit"],
  crt: ["scan", "bloom", "back", "curve", "persist", "flick", "noise", "edge"],
  led: ["bloom", "flick", "noise", "edge", "unlit"],
  oled: ["bloom", "noise", "edge"],
  eink: ["persist", "noise", "back", "edge", "unlit"],

const EFFECT_KEYS = ["scan", "bloom", "back", "curve", "persist", "flick", "noise", "view", "shadow", "mesh", "edge", "black", "unlit"];
const MATRIX_KEYS = ["nx", "ny", "pitch", "fillX", "fillY", "round", "bits", "dither", "src", "pattern", "image", "fit", "font", "tscale", "tpos", "tout", "invert", "sat", "gamma", "contrast", "persist"];
function relevant(d) {

  if (MATRIX_KEYS.includes(k) && seg) return false;
  if (d.sec === "Segmenti") return seg;
  if (k === "layout") return !seg && P.color === "rgb";
  if (EFFECT_KEYS.includes(k)) return (FX[P.type] || EFFECT_KEYS).includes(k);
  if (k === "pattern") return P.src === "pattern";
  if (k === "image") return P.src === "image";
  if (k === "fit") return P.src === "image" || P.src === "camera";
  if (k === "ghostD" || k === "ghostA") return P.ghost > 0;
  if (k === "glareA" || k === "glareW") return P.glare > 0;

  if (d.o || d.lib) { const o = optsOf(d).find((x) => String(x[0]) === String(v)); return o ? o[1] : String(v); }

/* --- Audio: clic come in CCD-1 --- */

/* --- Lista: 6 righe sempre visibili, nessuno scorrimento --- */
const rowsEl = $("rows");

let lastTap = { j: -1, t: 0 };

info();
if (P.src === "camera") camera(true);
requestAnimationFrame(frame);

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost"))
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => r.update()).catch(() => {});
let swReloaded = false;   // quando arriva una nuova versione, ricarica una volta sola
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("controllerchange", () => { if (!swReloaded && navigator.serviceWorker.controller) { swReloaded = true; location.reload(); } });
</script>
