<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DSP-1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DSP-1">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
/* --- Token Grado Zero --- */
:root {
  --surface: #ffffff; --ink: #000000; --on-ink: #ffffff;
  --line: var(--ink); --surface-inverse: var(--ink); --ink-inverse: var(--on-ink);
  --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono: Menlo, "SF Mono", Consolas, "DejaVu Sans Mono", monospace;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
  --radius-pill: 9999px; --border-hairline: 1px; --control-height: 28px;
  --opacity-muted: .5; --view: #e6e6e6;
  color-scheme: light;
}
:root[data-theme="dark"] { --surface: #000000; --ink: #ffffff; --on-ink: #000000; --view: #0b0b0b; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
html, body { margin: 0; position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--surface); color: var(--ink); font: 400 16px/22px var(--font-sans); }
button { font: inherit; color: inherit; }

#app { position: fixed; left: 0; top: 0; width: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
.top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); height: 32px; padding: 0 var(--space-3); flex: none; }
.top b { font-weight: 400; }
.top .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: var(--opacity-muted); font: 400 13px/1 var(--font-mono); text-transform: uppercase; }
.top .theme { width: var(--control-height); height: var(--control-height); padding: 0; background: none; border: 0; cursor: pointer; }

#view { position: relative; flex: none; width: 100%; background: var(--view); overflow: hidden; touch-action: none; }
#view canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#cross { position: absolute; border: 1px solid #fff; mix-blend-mode: difference; pointer-events: none; }

.lensrow { display: flex; gap: var(--space-3); height: 104px; padding: var(--space-2) var(--space-3); flex: none; }
#lens { width: 88px; height: 88px; flex: none; border: var(--border-hairline) solid var(--line); background: #000; image-rendering: pixelated; }
.info { flex: 1; min-width: 0; font: 400 12px/18px var(--font-mono); text-transform: uppercase; }
.info div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info .msg { font-style: italic; }

.tabs { box-sizing: border-box; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); height: var(--control-height); border-top: var(--border-hairline) solid var(--line); border-bottom: var(--border-hairline) solid var(--line); flex: none; }
.tabs button { padding: 0; background: none; border: 0; font: 400 10px/1 var(--font-sans); letter-spacing: .02em; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--surface-inverse); color: var(--ink-inverse); }

#rows { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 var(--space-3); touch-action: pan-y; }
.row { display: grid; grid-template-columns: 11ch minmax(0, 1fr) 10ch; align-items: center; gap: var(--space-2); height: 30px; padding: 0 var(--space-1); border-bottom: var(--border-hairline) solid rgba(128,128,128,.35); font: 400 14px/1 var(--font-sans); cursor: pointer; }
.row .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .vl { text-align: right; font: 400 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .bar { position: relative; height: 100%; }
.row .bar::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: currentColor; opacity: .35; }
.row .bar i { position: absolute; top: 7px; bottom: 7px; width: 3px; margin-left: -1px; background: currentColor; }
.row .bar u { position: absolute; top: 50%; height: 1px; background: currentColor; text-decoration: none; }
.row .dots { display: flex; gap: 4px; align-items: center; height: 100%; }
.row .dots s { width: 5px; height: 5px; border: 1px solid currentColor; border-radius: 50%; opacity: .6; }
.row .dots s.on { background: currentColor; opacity: 1; }
.row input { width: 100%; height: 24px; padding: 0 6px; border: var(--border-hairline) solid currentColor; border-radius: 0; background: transparent; color: inherit; font: 400 16px/1 var(--font-mono); -webkit-user-select: text; user-select: text; text-transform: uppercase; }
.row.text { grid-template-columns: 11ch minmax(0, 1fr); }
.row.act { grid-template-columns: minmax(0, 1fr) auto; }
.row.act .lb::before { content: "▸ "; }
.row.sel { background: var(--surface-inverse); color: var(--ink-inverse); }
.row.off { opacity: .45; }

.ctrl { display: grid; grid-template-columns: 44px 44px minmax(0, 1fr) 44px; gap: var(--space-2); grid-template-rows: minmax(0, 1fr); height: 76px; padding: var(--space-2) var(--space-3); flex: none; }
.ud { display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; gap: var(--space-2); }
.key { min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--surface); border: var(--border-hairline) solid var(--line); border-radius: 0; cursor: pointer; font: 400 14px/1 var(--font-sans); touch-action: none; }
.key.down { background: var(--surface-inverse); color: var(--ink-inverse); }
#wheel { width: 100%; height: 100%; border: var(--border-hairline) solid var(--line); touch-action: none; cursor: ew-resize; display: block; }
#file, #imp { display: none; }
</style>
</head>
<body>
<div id="app">
  <div class="top"><b>DSP-1</b><span class="pname" id="pname"></span><button class="theme" id="theme" aria-label="Tema">◐</button></div>
  <div id="view"><canvas id="gl" aria-label="Display simulato"></canvas><div id="cross"></div></div>
  <div class="lensrow"><canvas id="lens" aria-label="Lente"></canvas><div class="info" id="info"></div></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="rows"></div>
  <div class="ctrl">
    <div class="ud"><button class="key" id="kUp" aria-label="Parametro precedente">▲</button><button class="key" id="kDn" aria-label="Parametro successivo">▼</button></div>
    <button class="key" id="kL" aria-label="Diminuisci">◀</button>
    <canvas id="wheel" aria-label="Rotella"></canvas>
    <button class="key" id="kR" aria-label="Aumenta">▶</button>
  </div>
</div>
<input type="file" id="file" accept="image/*">
<input type="file" id="imp" accept=".json,application/json">
<script src="display.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
["gesturestart", "gesturechange", "gestureend"].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));
document.addEventListener("touchmove", (e) => { if (!e.target.closest("#rows")) e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", (e) => e.preventDefault());

const DPR = Math.min(window.devicePixelRatio || 1, 3);
const MINI = DPR === 3 && Math.min(screen.width, screen.height) === 375 && Math.max(screen.width, screen.height) === 812;

/* --- Impostazioni dell'app (non del display) --- */
const SET_DEF = { page: 0, rows: [0, 0, 0, 0, 0, 0, 0, 0], sound: "1", theme: "dark", zoom: 6, lens: null, scale: MINI ? "mini" : "native", libSel: "" };
const S = Object.assign({}, SET_DEF);
try { Object.assign(S, JSON.parse(store.get("dsp1-set", "{}"))); } catch (e) {}
let lib = {}; try { lib = JSON.parse(store.get("dsp1-lib", "{}")) || {}; } catch (e) {}
let saved = {}; try { saved = JSON.parse(store.get("dsp1-cur", "{}")) || {}; } catch (e) {}

const eng = DSP.create($("gl"), saved, { dpr: DPR });
let P = eng.preset;
eng.scale = S.scale === "mini" ? 1080 / 1125 : 1;
const PPI = 476;

let saveT = 0;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { store.set("dsp1-cur", JSON.stringify(P)); store.set("dsp1-set", JSON.stringify(S)); }, 250); }

/* --- Parametri, divisi per pagine --- */
const E = (pairs) => pairs.map((p) => (Array.isArray(p) ? p : [p, p]));
const pct = { u: "%" };
const PAGES = [
  { t: "TIPO", rows: [
    { k: "type", l: "TIPO", o: E([["lcd", "LCD COLORE"], ["lcdmono", "LCD MONO"], ["vfd", "VFD"], ["crt", "CRT"], ["led", "LED"], ["oled", "OLED"], ["eink", "E-INK"]]) },
    { k: "struct", l: "STRUTTURA", o: E([["matrix", "MATRICE"], ["seg", "SEGMENTI"]]) },
    { k: "light", l: "LUCE", o: E([["emit", "EMISSIVO"], ["trans", "RETROILL."], ["refl", "RIFLESSIVO"]]) },
    { k: "color", l: "COLORE", o: E([["rgb", "RGB"], ["mono", "MONO"]]) },
    { k: "scale", s: 1, l: "SCHERMO", o: E([["mini", "12 MINI"], ["native", "NATIVO"]]) },
  ] },
  { t: "PIXEL", rows: [
    { k: "nx", l: "COLONNE", min: 4, max: 400, st: 1 },
    { k: "ny", l: "RIGHE", min: 4, max: 320, st: 1 },
    { k: "pitch", l: "PASSO", min: 1, max: 40, st: 1, u: " PX" },
    { k: "layout", l: "SUBPIXEL", o: E([["none", "NESSUNO"], ["stripe", "STRISCE"], ["delta", "DELTA"], ["pentile", "PENTILE"]]) },
    { k: "fillX", l: "RIEMP. X", min: 5, max: 100, st: 1, ...pct },
    { k: "fillY", l: "RIEMP. Y", min: 5, max: 100, st: 1, ...pct },
    { k: "round", l: "ARROTOND.", min: 0, max: 100, st: 1, ...pct },
    { k: "bits", l: "LIVELLI", min: 1, max: 8, st: 1, f: (v) => String(Math.pow(2, v)) },
    { k: "dither", l: "DITHERING", o: E([[0, "OFF"], [1, "BAYER"]]) },
  ] },
  { t: "COLORE", rows: [
    { k: "tintH", l: "ACCESO H", min: 0, max: 359, st: 1, u: "°", wrap: 1 },
    { k: "tintS", l: "ACCESO S", min: 0, max: 100, st: 1, ...pct },
    { k: "tintL", l: "ACCESO L", min: 0, max: 100, st: 1, ...pct },
    { k: "bgH", l: "FONDO H", min: 0, max: 359, st: 1, u: "°", wrap: 1 },
    { k: "bgS", l: "FONDO S", min: 0, max: 100, st: 1, ...pct },
    { k: "bgL", l: "FONDO L", min: 0, max: 100, st: 1, ...pct },
    { k: "bright", l: "LUMINOSITA", min: 0, max: 200, st: 1, ...pct },
    { k: "contrast", l: "CONTRASTO", min: 0, max: 200, st: 1, ...pct },
    { k: "black", l: "NERO", min: 0, max: 50, st: 1, ...pct },
    { k: "gamma", l: "GAMMA", min: 40, max: 250, st: 1, f: (v) => (v / 100).toFixed(2) },
    { k: "sat", l: "SATURAZ.", min: 0, max: 200, st: 1, ...pct },
    { k: "unlit", l: "SPENTI", min: 0, max: 50, st: 1, ...pct },
  ] },
  { t: "EFFETTI", rows: [
    { k: "scan", l: "SCANLINE", min: 0, max: 100, st: 1, ...pct },
    { k: "bloom", l: "ALONE", min: 0, max: 100, st: 1, ...pct },
    { k: "back", l: "DISUNIF.", min: 0, max: 100, st: 1, ...pct },
    { k: "curve", l: "CURVATURA", min: 0, max: 100, st: 1, ...pct },
    { k: "persist", l: "SCIA", min: 0, max: 100, st: 1, ...pct },
    { k: "flick", l: "FLICKER", min: 0, max: 100, st: 1, ...pct },
    { k: "noise", l: "RUMORE", min: 0, max: 100, st: 1, ...pct },
    { k: "view", l: "ANGOLO", min: -100, max: 100, st: 1, ...pct },
    { k: "shadow", l: "OMBRA", min: 0, max: 100, st: 1, ...pct },
    { k: "mesh", l: "GRIGLIA VFD", min: 0, max: 100, st: 1, ...pct },
    { k: "edge", l: "BORDO", min: 0, max: 100, st: 1, ...pct },
  ] },
  { t: "VETRO", rows: [
    { k: "glare", l: "GLARE", min: 0, max: 100, st: 1, ...pct },
    { k: "glareA", l: "GLARE ANG.", min: -90, max: 90, st: 1, u: "°" },
    { k: "glareW", l: "GLARE LARG.", min: 5, max: 100, st: 1, ...pct },
    { k: "ghost", l: "DOPPIA IMM.", min: 0, max: 100, st: 1, ...pct },
    { k: "ghostD", l: "DISTANZA", min: 0, max: 60, st: 1, u: " PX" },
    { k: "ghostA", l: "DIREZIONE", min: 0, max: 359, st: 1, u: "°", wrap: 1 },
    { k: "frameW", l: "CORNICE", min: 0, max: 120, st: 1, u: " PX" },
    { k: "frameL", l: "CORNICE L", min: 0, max: 100, st: 1, ...pct },
  ] },
  { t: "FONTE", rows: [
    { k: "src", l: "SORGENTE", o: E([["pattern", "PATTERN"], ["image", "IMMAGINE"], ["camera", "CAMERA"], ["blank", "VUOTO"]]) },
    { k: "pattern", l: "PATTERN", o: E([["bars", "BARRE"], ["ramp", "RAMPA"], ["grid", "GRIGLIA"], ["scene", "SCENA"]]) },
    { a: "image", l: "CARICA IMMAGINE" },
    { k: "fit", l: "ADATTA", o: E([["cover", "RIEMPI"], ["contain", "CONTIENI"]]) },
    { k: "text", l: "TESTO", text: 1 },
    { k: "font", l: "CARATTERE", o: E([["5x7", "5×7"], ["sys", "SISTEMA"]]) },
    { k: "tscale", l: "SCALA", min: 1, max: 8, st: 1, u: "×" },
    { k: "tpos", l: "POSIZIONE", o: E([["top", "ALTO"], ["center", "CENTRO"], ["bottom", "BASSO"]]) },
    { k: "tscroll", l: "SCORRIM.", min: -20, max: 20, st: 1 },
    { k: "tout", l: "CONTORNO", o: E([[0, "OFF"], [1, "ON"]]) },
    { k: "invert", l: "INVERTI", o: E([[0, "OFF"], [1, "ON"]]) },
  ] },
  { t: "SEGM.", rows: [
    { k: "segN", l: "CIFRE", min: 1, max: 12, st: 1 },
    { k: "segK", l: "SEGMENTI", o: E([[7, "7"], [14, "14"]]) },
    { k: "segH", l: "ALTEZZA", min: 20, max: 800, st: 2, u: " PX" },
    { k: "segT", l: "SPESSORE", min: 4, max: 30, st: 1, ...pct },
    { k: "segSlant", l: "INCLINAZ.", min: 0, max: 30, st: 1, ...pct },
    { k: "segGap", l: "FESSURA", min: 0, max: 100, st: 1, ...pct },
    { k: "segSpace", l: "SPAZIATURA", min: 4, max: 80, st: 1, ...pct },
    { k: "icons", l: "ICONE", o: E([["none", "NESSUNA"], ["some", "ALCUNE"], ["all", "TUTTE"]]) },
    { k: "colon", l: "DUE PUNTI", o: E([["off", "OFF"], ["on", "ON"], ["blink", "LAMPEGGIO"]]) },
  ] },
  { t: "PRESET", rows: [
    { k: "name", l: "NOME", text: 1 },
    { a: "save", l: "SALVA NEL CATALOGO" },
    { k: "libSel", s: 1, l: "CATALOGO", lib: 1 },
    { a: "load", l: "CARICA DAL CATALOGO" },
    { a: "del", l: "ELIMINA DAL CATALOGO" },
    { a: "expJson", l: "ESPORTA PRESET (JSON)" },
    { a: "expMod", l: "ESPORTA MODULO (JS + JSON)" },
    { a: "imp", l: "IMPORTA PRESET" },
    { a: "shot", l: "SCREENSHOT" },
    { k: "sound", s: 1, l: "SUONI", o: E([["1", "ON"], ["0", "OFF"]]) },
    { k: "theme", s: 1, l: "TEMA", o: E([["dark", "SCURO"], ["light", "CHIARO"]]) },
  ] },
];
const libOpts = () => { const k = Object.keys(lib); return k.length ? k.map((n) => [n, n]) : [["", "VUOTO"]]; };
const optsOf = (d) => (d.lib ? libOpts() : d.o);
const getV = (d) => (d.s ? S[d.k] : P[d.k]);
function fmt(d, v) {
  if (d.o || d.lib) { const o = optsOf(d).find((x) => String(x[0]) === String(v)); return o ? o[1] : String(v); }
  return d.f ? d.f(v) : v + (d.u || "");
}

/* --- Audio: clic come in CCD-1 --- */
let actx = null, noiseBuf = null;
function audio() {
  if (actx) { if (actx.state === "suspended") actx.resume(); return actx; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = actx.createBuffer(1, Math.round(actx.sampleRate * 0.08), actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { actx = null; }
  return actx;
}
function tick(t0, freq, dur, gain, hp) {
  const a = actx, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf; f.type = "bandpass"; f.frequency.value = hp; f.Q.value = 1.2;
  g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t0, Math.random() * 0.03, dur + 0.01);
  const o = a.createOscillator(), og = a.createGain(); o.frequency.value = freq; o.type = "square";
  og.gain.setValueAtTime(gain * 0.25, t0); og.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * 0.6);
  o.connect(og).connect(a.destination); o.start(t0); o.stop(t0 + dur);
}
const SND = {
  detent: [[3200, 0.006, 0.12, 6000]],
  stop:   [[700, 0.012, 0.16, 1200]],
  set:    [[1500, 0.020, 0.30, 2600]],
  menu:   [[1100, 0.022, 0.30, 2000]],
  repeat: [[2400, 0.008, 0.12, 4800]],
  act:    [[900, 0.035, 0.40, 2600], [1400, 0.012, 0.12, 2800, 0.05]],
};
let lastSnd = 0;
function sound(k) {
  if (S.sound !== "1" || !actx) return;
  const now = performance.now(); if (k === "detent" && now - lastSnd < 18) return; lastSnd = now;
  const t0 = actx.currentTime + 0.002;
  for (const [f, d, g, bp, dt] of SND[k]) tick(t0 + (dt || 0), f, d, g, bp);
}
["touchend", "click"].forEach((t) => document.addEventListener(t, () => { if (S.sound === "1") audio(); }, true)); // iOS sblocca l'audio solo dopo un tocco

/* --- Righe --- */
const rowsEl = $("rows");
let msg = "", msgT = 0, confirmDel = false;
function flash(t) { msg = t; clearTimeout(msgT); msgT = setTimeout(() => { msg = ""; info(); }, 1800); info(); }
function rowHtml(d) {
  if (d.a) return `<span class="lb">${d.l}</span><span class="vl"></span>`;
  if (d.text) return `<span class="lb">${d.l}</span><input type="text" maxlength="64" autocomplete="off" autocorrect="off" spellcheck="false">`;
  return `<span class="lb">${d.l}</span><span class="${d.o || d.lib ? "dots" : "bar"}"></span><span class="vl"></span>`;
}
function buildRows() {
  const pg = PAGES[S.page];
  rowsEl.innerHTML = "";
  pg.rows.forEach((d, i) => {
    const r = document.createElement("div");
    r.className = "row" + (d.a ? " act" : d.text ? " text" : "");
    r.innerHTML = rowHtml(d); r.dataset.i = i;
    if (d.text) {
      const inp = r.querySelector("input"); inp.value = getV(d) || "";
      inp.addEventListener("input", () => { P[d.k] = inp.value.toUpperCase(); if (d.k === "text") eng.seg.text = P.text; save(); info(); });
      inp.addEventListener("focus", () => select(i, true));
    }
    rowsEl.appendChild(r);
    updRow(i);
  });
  [...$("tabs").children].forEach((b, i) => b.setAttribute("aria-pressed", i === S.page ? "true" : "false"));
  select(S.rows[S.page] || 0, true);
}
function updRow(i) {
  const d = PAGES[S.page].rows[i], r = rowsEl.children[i]; if (!r || d.text) return;
  if (d.a) { r.querySelector(".vl").textContent = d.a === "del" && confirmDel ? "TOCCA ANCORA" : ""; return; }
  const v = getV(d);
  r.querySelector(".vl").textContent = fmt(d, v);
  if (d.o || d.lib) {
    const o = optsOf(d), idx = o.findIndex((x) => String(x[0]) === String(v));
    r.querySelector(".dots").innerHTML = o.length <= 8 ? o.map((_, j) => `<s class="${j === idx ? "on" : ""}"></s>`).join("") : `<s class="on"></s> ${idx + 1}/${o.length}`;
  } else {
    const x = (v - d.min) / (d.max - d.min) * 100, z = d.min < 0 ? -d.min / (d.max - d.min) * 100 : 0;
    r.querySelector(".bar").innerHTML = `<u style="left:${Math.min(x, z)}%;width:${Math.abs(x - z)}%;height:3px;margin-top:-1px"></u><i style="left:${x}%"></i>`;
  }
  const relevant = relevance(d);
  r.classList.toggle("off", !relevant);
}
function relevance(d) {

  requestAnimationFrame(frame);
  compose(t);
  eng.render(t);
  drawLens();
  const dt = t - lastT; lastT = t; if (dt > 0) fps = fps * 0.95 + (1000 / dt) * 0.05;
  if (t - infoT > 1000) { infoT = t; info(); }
}
layout();
buildRows();
info();
if (P.src === "camera") camera(true);
requestAnimationFrame(frame);

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost"))
  navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
